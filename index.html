<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>
<meta name="description" content="Our website is being updated. Back soon.">
<meta name="theme-color" content="#3E2810">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #3E2810;
    --text: #F5ECD7;
    --muted: #DFC99A;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }
  main { max-width: 36rem; }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: clamp(2.5rem, 9vw, 4.5rem);
    line-height: 1.1;
    margin-bottom: 1.25rem;
  }
  p { line-height: 1.6; color: var(--muted); }
  .ro { margin-top: .25rem; }
</style>
</head>
<body>
<main>
  <h1>Under Construction</h1>
  <p>We are updating our website and will be back soon.</p>
  <p class="ro">Site-ul este în lucru. Revenim în curând.</p>
</main>
</body>
</html>
